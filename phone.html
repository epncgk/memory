<script>
const $=s=>document.querySelector(s),scr=$('#scr');

const msgs=[{m:0,x:'내일 일정 확인했어?',d:new Date(Date.now()-864e5),r:1},{m:1,x:'응, 확인했어. 걱정 마',d:new Date(Date.now()-864e5+6e4),r:1},
{m:0,x:'Astina, 어디야? 아까부터 계속 연락했는데.',d:new Date(Date.now()-6e4),r:0}];
let locked=true,cur=null,on=true,got2=false;
function tick(){const d=now();const t=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:false});$('#clk').textContent=t;$('#lt').textContent=t;const ds=d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});$('#ld').textContent=ds;$('#ch').textContent=d.getHours()%12||12;$('#cm').textContent=String(d.getMinutes()).padStart(2,'0');$('#cd').innerHTML=d.toLocaleDateString('en-US',{weekday:'short'})+'<br>'+d.getDate();$('#tc').textContent=t;$('#td').textContent=ds}
setInterval(tick,1000);tick();
function fit(){const de=document.documentElement,vv=window.visualViewport,W=Math.round(Math.min(vv?vv.width:1e5,innerWidth,de.clientWidth||1e5)),H=Math.round(Math.min(vv?vv.height:1e5,innerHeight,de.clientHeight||1e5)),mob=W<700,p=$('#phone');let s=mob?W/393:Math.min((H-32)/852,W/393),h=mob?H/s:852;p.style.height=scr.style.height=h+'px';p.style.borderRadius=scr.style.borderRadius=mob?'0':'55px';p.style.transform=`translate(-50%,-50%) scale(${s})`}addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));addEventListener('load',fit);if(window.visualViewport)visualViewport.addEventListener('resize',fit);fit();
/* 홈 */
const SV=p=>`<svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const D={m:'<path d="M5 5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-9l-5 4v-4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/>',p:'<path d="M6.5 4l2.5 4-1.8 1.5a10 10 0 0 0 4.8 4.8L14 12.5l4 2.5-1 3.5c-8 1-13-5-12-11z"/>',g:'<text x="12" y="18" text-anchor="middle" font-size="20" font-weight="700" font-family="Georgia,serif" fill="currentColor" stroke="none">G</text>',f:'<rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.5"/><path d="M4 18l5-5 4 4 3-3 4 4"/>',u:'<path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="16" r="2"/>',c:'<rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l1.5-3h5L16 7"/>',n:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/>',k:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M8 3v4M16 3v4"/>',t:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',v:'<path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10"/>',w:'<rect x="5" y="3" width="14" height="8" rx="2"/><rect x="5" y="13" width="14" height="8" rx="2"/>',a:'<path d="M4 12v0M8 8v8M12 5v14M16 9v6M20 12v0"/>'};
const A={m:['Messages','#a9bdaa','#fff'],p:['Phone','#a0b5c8','#fff'],g:['Google','#f4f2ee','#4a4f57'],f:['Images','#dccbc6','#fff'],u:['Music','#bba9b9','#fff'],c:['Camera','#8e98a5','#fff'],n:['Note','#ebe4d3','#6b6558'],k:['Calendar','#f4f2ee','#c46f7e'],t:['Clock','#6e7683','#fff'],v:['Novel','#b8a58c','#fff'],w:['Webtoon','#8fb0a0','#fff'],a:['Audio','#9aa3c4','#fff']};
const ic=id=>`<div class="ic" data-a="${id}"><i style="background:${A[id][1]};color:${A[id][2]}">${SV(D[id])}</i><span>${A[id][0]}</span></div>`;
function cal(){const d=now(),y=d.getFullYear(),m=d.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();$('#kh').textContent=`${y}년 ${m+1}월`;let h='일월화수목금토'.split('').map(x=>`<b>${x}</b>`).join('')+'<span></span>'.repeat(f);for(let i=1;i<=n;i++)h+=`<span class="${i==d.getDate()?'td':''}">${i}</span>`;$('#kg').innerHTML=h}

const set=(s,l)=>$(s).innerHTML=l.split('').map(ic).join('');set('#tr','tknu');set('#bl','gvwa');set('#dock','pmfc');
document.addEventListener('click',e=>{const i=e.target.closest('.ic');if(!i||locked)return;const a=i.dataset.a;if(a=='h'){openApp('m');openThread()}else if(a=='c')$('#cam').click();else openApp(a)});
function openApp(id){cur=id;document.querySelectorAll('.app').forEach(a=>a.classList.toggle('open',a.id=='a-'+id));scr.classList.toggle('lt','gnkva'.includes(id));if(id=='k')cal();if(id=='v')nvList();if(id=='w')wtList();$('#banner').classList.remove('s');if(id=='m')showList()}
function goHome(){cur=null;document.querySelectorAll('.app').forEach(a=>a.classList.remove('open'));scr.classList.toggle('lt',!locked);$('#th').classList.remove('o')}
function unlock(){locked=false;scr.classList.add('lt');$('#lock').classList.add('gone')}
function lockIt(){locked=true;goHome();$('#lock').classList.remove('gone');notes()}
$('#hb').onclick=()=>locked?unlock():goHome();
let y0=null;$('#lock').onpointerdown=e=>y0=e.clientY;$('#lock').onpointerup=e=>{if(y0!=null&&y0-e.clientY>70)unlock();y0=null};
$('#pw').onclick=()=>{if(on){on=false;$('#off').classList.remove('hide');lockIt()}else{on=true;$('#off').classList.add('hide');tick();if(!got2){got2=true;setTimeout(()=>receive('방금 말한 거 잊지 마. 지금 나와, 할 말이 있어. — T'),2500)}}};
/* 알림 */
function notes(){$('#nots').innerHTML=msgs.filter(m=>!m.m&&!m.r).map(m=>`<div class="n"><small><span>💬 메시지</span><span>${(now()-m.d)<12e4?'지금':hm(m.d)}</span></small><b>Terriod</b>${m.x}</div>`).join('');document.querySelectorAll('.n').forEach(n=>n.onclick=()=>{unlock();openApp('m');openThread()})}
function receive(x){msgs.push({m:0,x,d:now(),r:0});if(navigator.vibrate)navigator.vibrate(200);if(cur=='m'&&$('#th').classList.contains('o'))return openThread();if(locked)notes();else{const b=$('#banner');b.innerHTML=`<div class="n"><small><span>💬 메시지</span><span>지금</span></small><b>Terriod</b>${x}</div>`;b.classList.add('s');b.onclick=()=>{openApp('m');openThread()};setTimeout(()=>b.classList.remove('s'),4500)}if(cur=='m')showList()}
/* 메시지 */
