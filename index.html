    const d = now();

    $('#clk').textContent = t;
    $('#lt').textContent = t;
    const ds = d.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' });

    $('#ch').textContent = d.getHours() % 12 || 12;
    $('#cm').textContent = String(d.getMinutes()).padStart(2, '0');
    $('#cd').innerHTML = d.toLocaleDateString('en-US', { weekday: 'short' }) + '<br>' + d.getDate();
    $('#tc').textContent = t;
    $('#td').textContent = ds;
}
setInterval(tick, 1000);
tick();
const BASE_W = 393, BASE_H = 852;
function fit() {
    const vv = window.visualViewport, de = document.documentElement;
    const W = Math.round(Math.min(vv ? vv.width : Infinity, innerWidth, de.clientWidth || Infinity));
    const H = Math.round(Math.min(vv ? vv.height : Infinity, innerHeight, de.clientHeight || Infinity));
    const full = W < 700;
    const scale = full ? W / BASE_W : Math.min((H - 32) / BASE_H, W / BASE_W);
    const height = full ? H / scale : BASE_H;
    document.body.classList.toggle('full', full);
    de.style.setProperty('--h', height + 'px');
    $('#phone').style.transform = `translate(-50%,-50%) scale(${scale})`;
}
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 200));
if (window.visualViewport)
    visualViewport.addEventListener('resize', fit);
fit();
/* 홈 */

const D = { m: '<path d="M5 5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-9l-5 4v-4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/>', p: '<path d="M6.5 4l2.5 4-1.8 1.5a10 10 0 0 0 4.8 4.8L14 12.5l4 2.5-1 3.5c-8 1-13-5-12-11z"/>', g: '<text x="12" y="18" text-anchor="middle" font-size="20" font-weight="700" font-family="Georgia,serif" fill="currentColor" stroke="none">G</text>', f: '<rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.5"/><path d="M4 18l5-5 4 4 3-3 4 4"/>', u: '<path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="16" r="2"/>', c: '<rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l1.5-3h5L16 7"/>', n: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/>', k: '<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M8 3v4M16 3v4"/>', t: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', v: '<path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10"/>', w: '<rect x="5" y="3" width="14" height="8" rx="2"/><rect x="5" y="13" width="14" height="8" rx="2"/>', a: '<path d="M4 12v0M8 8v8M12 5v14M16 9v6M20 12v0"/>' };
const A = { m: ['Messages', '#a9bdaa', '#fff'], p: ['Phone', '#a0b5c8', '#fff'], g: ['Google', '#f4f2ee', '#4a4f57'], f: ['Images', '#dccbc6', '#fff'], u: ['Music', '#bba9b9', '#fff'], c: ['Camera', '#8e98a5', '#fff'], n: ['Note', '#ebe4d3', '#6b6558'], k: ['Calendar', '#f4f2ee', '#c46f7e'], t: ['Clock', '#6e7683', '#fff'], v: ['Novel', '#b8a58c', '#fff'], w: ['Webtoon', '#8fb0a0', '#fff'], a: ['Audio', '#9aa3c4', '#fff'] };
const ic = id => `<div class="ic" data-a="${id}"><i style="background:${A[id][1]};color:${A[id][2]}">${SV(D[id])}</i><span>${A[id][0]}</span></div>`;
function cal() {
    const d = now(), y = d.getFullYear(), m = d.getMonth(), f = new Date(y, m, 1).getDay(), n = new Date(y, m + 1, 0).getDate();
    $('#kh').textContent = `${y}년 ${m + 1}월`;
    let h = '일월화수목금토'.split('').map(x => `<b>${x}</b>`).join('') + '<span></span>'.repeat(f);
    for (let i = 1; i <= n; i++)
        h += `<span class="${i == d.getDate() ? 'td' : ''}">${i}</span>`;
    $('#kg').innerHTML = h;
}
const set = (s, l) => $(s).innerHTML = l.split('').map(ic).join('');
set('#tr', 'tknu');
set('#bl', 'gvwa');
set('#dock', 'pmfc');
document.addEventListener('click', e => {
    const i = e.target.closest('.ic');
    if (!i || locked)
        return;
    const a = i.dataset.a;
    if (a == 'h') {
        openApp('m');
        openThread();
    }
    else if (a == 'c')
        $('#cam').click();
    else
        openApp(a);
});
function openApp(id) {
    cur = id;
    document.querySelectorAll('.app').forEach(a => a.classList.toggle('open', a.id == 'a-' + id));
    scr.classList.toggle('lt', 'gnkva'.includes(id));

        cal();

        nvList();
    if (id == 'w')
        wtList();

    if (id == 'm')
        showList();
}
function goHome() {
    cur = null;
    document.querySelectorAll('.app').forEach(a => a.classList.remove('open'));
    scr.classList.toggle('lt', !locked);
    $('#th').classList.remove('o');
}
function unlock() {
    locked = false;
    scr.classList.add('lt');
    $('#lock').classList.add('gone');
    if (!welcomed) {
        welcomed = true;
        setTimeout(() => receive('방금 말한 거 잊지 마. 지금 나와, 할 말이 있어. — T'), 2500);
    }
}
$('#hb').onclick = () => locked ? unlock() : goHome();
let y0 = null;
$('#lock').onpointerdown = e => y0 = e.clientY;
$('#lock').onpointerup = e => {
    if (y0 != null && y0 - e.clientY > 70)
        unlock();
    y0 = null;
};
/* 알림 */
function notes() {
    $('#nots').innerHTML = msgs.filter(m => !m.m && !m.r).map(m => `<div class="n"><small><span>💬 메시지</span><span>${(now() - m.d) < 12e4 ? '지금' : hm(m.d)}</span></small><b>Terriod</b>${m.x}</div>`).join('');
    document.querySelectorAll('.n').forEach(n => n.onclick = () => {
        unlock();
        openApp('m');
        openThread();
    });
}
function receive(x) {
    msgs.push({ m: 0, x, d: now(), r: 0 });
    if (navigator.vibrate)
        navigator.vibrate(200);
    if (cur == 'm' && $('#th').classList.contains('o'))
        return openThread();
    if (locked)
        notes();
    else {
        const b = $('#banner');
        b.innerHTML = `<div class="n"><small><span>💬 메시지</span><span>지금</span></small><b>Terriod</b>${x}</div>`;
        b.classList.add('s');
        b.onclick = () => {
            openApp('m');
            openThread();
        };
        setTimeout(() => b.classList.remove('s'), 4500);
    }
    if (cur == 'm')
        showList();
}
/* 메시지 */
function showList() {
    $('#th').classList.remove('o');
    const l = msgs[msgs.length - 1], u = msgs.some(m => !m.m && !m.r);
    $('#ml').innerHTML = `<div class="row" id="r1"><div class="av">T</div><div><b>Terriod</b><div style="color:#999;font-size:14px">${l.x}</div></div>${u ? '<div class="dot"></div>' : ''}</div>`;
    $('#r1').onclick = openThread;
}
function openThread() {
    msgs.forEach(m => m.r = 1);
    $('#th').classList.add('o');
    draw();
    notes();
}
function draw() {
    let h = '<div class="ts">오늘 ' + hm(now()) + '</div>';
    msgs.forEach(m => h += `<div class="b ${m.m ? 'me' : 't'}">${m.x.replace(/</g, '&lt;')}</div>`);
    $('#bub').innerHTML = h;
    $('#bub').scrollTop = 1e5;
}
$('#bk').onclick = showList;
function send() {
    const v = $('#mi').value.trim();
    if (!v)
        return;
    $('#mi').value = '';
    msgs.push({ m: 1, x: v, d: now(), r: 1 });
    draw();
    const r = (REPLIES.find(a => a[0].test(v)) || [0, DEFAULT[Math.random() * DEFAULT.length | 0]])[1];
    setTimeout(() => {
        $('#bub').insertAdjacentHTML('beforeend', '<div class="b t" id="ty">···</div>');
        $('#bub').scrollTop = 1e5;
    }, 600);
    setTimeout(() => {
        const t = $('#ty');
        t && t.remove();
        msgs.push({ m: 0, x: r, d: now(), r: 1 });
        draw();
    }, 1800 + Math.random() * 1000);
}
$('#sd').onclick = send;
$('#mi').onkeydown = e => {
    if (e.key == 'Enter')
        send();
};
/* 전화 */
let num = '', ct;
$('#keys').innerHTML = '123456789*0#'.split('').map(k => `<button>${k}</button>`).join('') + '<span></span><button class="call" id="cb">📞</button>';
$('#keys').onclick = e => {
    const b = e.target.closest('button');
    if (!b)
        return;
    if (b.id == 'cb')
        return call(num);
    num += b.textContent;
    $('#num').textContent = num;
};
$('#del').onclick = () => {
    num = num.slice(0, -1);
    $('#num').textContent = num;
};
$('#fav').onclick = () => call('Terriod');
function call(n) {
    if (!n)
        return;
    $('#cn').textContent = n;
    $('#cs').textContent = '연결 중…';
    $('#calling').classList.add('o');
    let s = 0;
    clearInterval(ct);
    setTimeout(() => {
        ct = setInterval(() => {
            s++;
            $('#cs').textContent = String(s / 60 | 0).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
        }, 1000);
        $('#cs').textContent = '00:00';
    }, 2000);
}
$('#end').onclick = () => {
    clearInterval(ct);
    $('#calling').classList.remove('o');
};
/* Google */
$('#gq').onkeydown = e => {
    if (e.key != 'Enter' || !e.target.value.trim())
        return;
    const q = e.target.value.trim(), a = document.createElement('a');
    a.href = 'https://www.google.com/search?q=' + encodeURIComponent(q);
    a.target = '_blank';
    a.textContent = 'Google에서 검색 결과 보기 →';
    const g = $('#gr');
    g.innerHTML = '<p>검색어: <b></b></p>';
    g.querySelector('b').textContent = q;
    g.append(a);
};

let ph = [WP, 'linear-gradient(#f6d365,#fda085)', 'linear-gradient(#a1c4fd,#c2e9fb)', 'linear-gradient(#84fab0,#8fd3f4)', 'linear-gradient(#d4fc79,#96e6a1)', 'linear-gradient(#fbc2eb,#a6c1ee)'];
function drawP() {
    $('#pg').innerHTML = ph.map((p, i) => `<div data-i="${i}" style="background-image:${p.startsWith('linear') ? p : `url(${p})`}"></div>`).join('');
}
drawP();
$('#pg').onclick = e => {
    const d = e.target.closest('div');
    if (!d)
        return;
    const p = ph[d.dataset.i];
    $('#pv').style.display = 'block';
    $('#pv').style.backgroundImage = p.startsWith('linear') ? p : `url(${p})`;
};
$('#pv').onclick = () => $('#pv').style.display = 'none';
$('#up').onchange = e => {
    const f = e.target.files[0];
    if (f) {
        ph.unshift(URL.createObjectURL(f));
        drawP();
    }
};
/* 음악 */
const T = [{ t: 'Midnight Rain', a: 'Terriod', n: [0, 3, 7, 10] }, { t: 'Velvet Hour', a: 'Astina', n: [2, 5, 9, 12] }, { t: 'Blue Static', a: 'Terriod', n: [0, 5, 8, 12] }];
let ti = 0, pl = false, pos = 0, ac, iv, au = new Audio();
function ui() {
    $('#tt').textContent = T[ti].t;
    $('#ta').textContent = T[ti].a;
    $('#pp').textContent = pl ? '⏸️' : '▶️';
    $('#tl').innerHTML = T.map((t, i) => `<div class="tr ${i == ti ? 'a' : ''}" data-i="${i}"><span>${t.t}</span><span>${t.a}</span></div>`).join('');
}
function stop() {
    clearInterval(iv);
    au.pause();
}
function play() {
    stop();
    pl = true;
    ui();
    const t = T[ti];
    if (t.src) {
        au.src = t.src;
        au.play();
        iv = setInterval(() => $('#pr i').style.width = (au.currentTime / au.duration * 100 || 0) + '%', 300);
